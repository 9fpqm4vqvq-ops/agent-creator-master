<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Actual browser acceptance</title></head><body><iframe id="app" src="index.html" style="width:390px;height:800px"></iframe><pre id="result">PENDING</pre><script>
window.addEventListener('load',()=>{const a=[];const frame=document.getElementById('app');const w=frame.contentWindow,d=w.document;function check(id,kind,fn,evidence){fn();a.push({id,kind,status:'PASS',evidence});}function assert(ok,msg){if(!ok)throw Error(msg);}try{
w.localStorage.clear();w.location.reload();frame.onload=()=>{try{const doc=frame.contentDocument;const field=doc.getElementById('task-title');field.value='Browser task';doc.getElementById('add-form').dispatchEvent(new Event('submit',{cancelable:true}));assert(doc.querySelectorAll('#tasks li').length===1,'add failed');doc.querySelector('#tasks input').click();doc.querySelector('[data-filter=completed]').click();assert(doc.querySelectorAll('#tasks li').length===1,'completed filter failed');doc.querySelector('[data-filter=active]').click();assert(doc.querySelectorAll('#tasks li').length===0,'active filter failed');check('browser_functionality','BROWSER',()=>{},'Chromium actually added/toggled/filtered a task');check('responsive','RESPONSIVE',()=>assert(doc.documentElement.scrollWidth<=frame.clientWidth,'mobile overflow'),'Actual 390px iframe has no horizontal overflow');check('accessibility','ACCESSIBILITY',()=>{assert(doc.querySelector('label[for=task-title]'),'missing input label');assert(doc.querySelector('[role=status]'),'missing live status');assert(doc.querySelector('nav[aria-label]'),'missing filter navigation name');},'Actual DOM has input labels, named navigation and live status; not a full WCAG audit');document.getElementById('result').textContent=JSON.stringify({status:'PASS',assertions:a});}catch(e){document.getElementById('result').textContent=JSON.stringify({status:'FAIL',error:e.message});}};
}catch(e){document.getElementById('result').textContent=JSON.stringify({status:'FAIL',error:e.message});}});
</script></body></html>
